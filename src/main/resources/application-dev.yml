spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_boot_tutorial
    username: spring_boot_tutorial
    password: spring_boot_tutorial
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,appinfo

logging:
  level:
    com.edgareldy.springboottutorial: DEBUG
